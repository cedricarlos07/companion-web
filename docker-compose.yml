services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-db
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    ports:
      - '5433:5432'
    volumes:
      - companion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companion -d companion']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  companion-pgdata:
