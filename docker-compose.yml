services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    ports:
      - '5433:5432'
    volumes:
      - companion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companion -d companion']
      interval: 5s
      timeout: 3s
      retries: 20

  activepieces:
    image: activepieces/activepieces:latest
    container_name: companion-activepieces
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - '5678:80'
    environment:
      AP_ENGINE_EXECUTION_ENVIRONMENT: production
      AP_API_URL: http://localhost:5678
      AP_ENVIRONMENT: production
      AP_ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
      AP_JWT_SECRET: companion-ap-jwt-secret-32ch-min
      AP_POSTGRES_DATABASE: activepieces
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_USERNAME: companion
      AP_POSTGRES_PASSWORD: companion
      AP_REDIS_URL: redis://redis:6379
      AP_QUEUE_MODE: REDIS
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'
      AP_SANDBOX_RUN_TIME_SECONDS: '600'
      AP_SIGNUP_ENABLED: 'true'
      AP_PROJECT_ID: '1'
      AP_FRONTEND_URL: http://localhost:5678
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_TELEMETRY_DISABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - activepieces-data:/usr/src/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: companion-redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  companion-pgdata:
  activepieces-data:
