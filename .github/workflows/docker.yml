name: docker

on:
  push:
    tags: ['v*']

concurrency:
  group: docker-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version cohérente
        run: |
          PKG=$(node -p "require('./package.json').version")
          [ "${{ github.ref_name }}" = "v$PKG" ] || { echo "tag ≠ package.json ($PKG)"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cedricarlos07/companion-web:${{ github.ref_name }}
            ghcr.io/cedricarlos07/companion-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
