services:
  # ---- PostgreSQL 16 + pgvector ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-companion}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - companion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companion -d companion']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Redis (rate limiting + queues) ----
  redis:
    image: redis:7-alpine
    container_name: companion-redis
    restart: unless-stopped

  # ---- Activepieces (760+ integrations) ----
  activepieces:
    image: activepieces/activepieces:latest
    container_name: companion-activepieces
    ports:
      - '5678:80'
    environment:
      AP_ENGINE_EXECUTION_ENVIRONMENT: production
      AP_FRONTEND_URL: ${ACTIVEPIECES_URL:-http://localhost:5678}
      AP_API_URL: ${ACTIVEPIECES_URL:-http://localhost:5678}
      AP_ENVIRONMENT: production
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY required (32-char hex)}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?AP_JWT_SECRET required}
      AP_POSTGRES_DATABASE: activepieces
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_USERNAME: ${POSTGRES_USER:-companion}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      AP_REDIS_URL: redis://redis:6379
      AP_QUEUE_MODE: REDIS
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_SANDBOX_RUN_TIME_SECONDS: '600'
      AP_SIGNUP_ENABLED: 'true'
      AP_TELEMETRY_DISABLED: 'true'
    volumes:
      - activepieces-data:/usr/src/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- Companion (frontend + API + MCP Server) ----
  companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion-app
    ports:
      - '5299:5299'
    environment:
      NODE_ENV: production
      PORT: 5299
      DATABASE_URL: postgres://${POSTGRES_USER:-companion}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-companion}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      MEMORY_SEARCH_ENGINE: fusion
      MEM0_VECTOR_STORE: pgvector
      ACTIVEPIECES_ENABLED: ${ACTIVEPIECES_ENABLED:-false}
      ACTIVEPIECES_URL: ${ACTIVEPIECES_URL:-http://activepieces:80}
      ACTIVEPIECES_MCP_TOKEN: ${ACTIVEPIECES_MCP_TOKEN:-}
      AUTO_SEED: ${AUTO_SEED:-true}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    volumes:
      - companion-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  companion-pgdata:
  activepieces-data:
  companion-uploads:
