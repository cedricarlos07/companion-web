# COMPANION — déploiement un-conteneur (base embarquée PGlite)
#
#   docker compose up -d        (après avoir créé le fichier .env — install.sh le fait)
#
# Le volume /app/data conserve TOUTES vos données (base + fichiers).
# Pour une base PostgreSQL externe (gros volumes) : docker-compose.postgres.yml

services:
  companion:
    image: ghcr.io/cedricarlos07/companion-web:${COMPANION_VERSION:-latest}
    container_name: companion-app
    ports:
      - '5299:5299'
    environment:
      NODE_ENV: production
      PORT: 5299
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      MEMORY_SEARCH_ENGINE: fusion
      MEM0_VECTOR_STORE: pgvector
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    volumes:
      - companion-data:/app/data
    restart: unless-stopped

volumes:
  companion-data:
